<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Estudiantes</title>

    <link rel="stylesheet" href="estilos.css">

</head>


<body>


    <!-- ==================================
         ENCABEZADO
    =================================== -->

    <header class="encabezado">

        <h1>Registro de Estudiantes</h1>

        <p>
            Formulario de registro académico
        </p>

    </header>



    <!-- ==================================
         CONTENEDOR PRINCIPAL
    =================================== -->

    <main class="contenedor">


        <!-- ==================================
             FORMULARIO
        =================================== -->

        <form action="#" method="post">


            <!-- ==================================
                 DATOS PERSONALES
            =================================== -->

            <fieldset>

                <legend>Datos personales</legend>


                <!-- NOMBRE -->

                <div class="campo">

                    <label for="nombre">
                        Nombre completo:
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ingrese su nombre completo"
                        required
                    >

                </div>


                <!-- IDENTIDAD -->

                <div class="campo">

                    <label for="identidad">
                        Número de identidad:
                    </label>

                    <input
                        type="text"
                        id="identidad"
                        name="identidad"
                        placeholder="0000-0000-00000"
                        required
                    >

                </div>


                <!-- EDAD -->

                <div class="campo">

                    <label for="edad">
                        Edad:
                    </label>

                    <input
                        type="number"
                        id="edad"
                        name="edad"
                        min="1"
                        max="100"
                        placeholder="Ingrese su edad"
                        required
                    >

                </div>


                <!-- FECHA DE NACIMIENTO -->

                <div class="campo">

                    <label for="fecha">
                        Fecha de nacimiento:
                    </label>

                    <input
                        type="date"
                        id="fecha"
                        name="fecha"
                        required
                    >

                </div>

            </fieldset>



            <!-- ==================================
                 DATOS DE CONTACTO
            =================================== -->

            <fieldset>

                <legend>Información de contacto</legend>


                <!-- CORREO -->

                <div class="campo">

                    <label for="correo">
                        Correo electrónico:
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        required
                    >

                </div>


                <!-- TELÉFONO -->

                <div class="campo">

                    <label for="telefono">
                        Teléfono:
                    </label>

                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        placeholder="+504 9999-9999"
                        required
                    >

                </div>


                <!-- CIUDAD -->

                <div class="campo">

                    <label for="ciudad">
                        Ciudad:
                    </label>

                    <select id="ciudad" name="ciudad" required>

                        <option value="">
                            Seleccione una ciudad
                        </option>

                        <option value="san-pedro-sula">
                            San Pedro Sula
                        </option>

                        <option value="tegucigalpa">
                            Tegucigalpa
                        </option>

                        <option value="la-ceiba">
                            La Ceiba
                        </option>

                        <option value="choloma">
                            Choloma
                        </option>

                        <option value="puerto-cortes">
                            Puerto Cortés
                        </option>

                    </select>

                </div>

            </fieldset>



            <!-- ==================================
                 INFORMACIÓN ACADÉMICA
            =================================== -->

            <fieldset>

                <legend>Información académica</legend>


                <!-- CURSO -->

                <div class="campo">

                    <label for="curso">
                        Curso:
                    </label>

                    <select id="curso" name="curso" required>

                        <option value="">
                            Seleccione un curso
                        </option>

                        <option value="desarrollo-web">
                            Desarrollo Web
                        </option>

                        <option value="programacion">
                            Programación
                        </option>

                        <option value="base-datos">
                            Base de Datos
                        </option>

                        <option value="redes">
                            Redes
                        </option>

                        <option value="informatica">
                            Informática
                        </option>

                    </select>

                </div>


                <!-- JORNADA -->

                <div class="campo">

                    <label>
                        Jornada:
                    </label>

                    <div class="opciones">

                        <label>
                            <input
                                type="radio"
                                name="jornada"
                                value="matutina"
                                required
                            >
                            Matutina
                        </label>


                        <label>
                            <input
                                type="radio"
                                name="jornada"
                                value="vespertina"
                            >
                            Vespertina
                        </label>


                        <label>
                            <input
                                type="radio"
                                name="jornada"
                                value="nocturna"
                            >
                            Nocturna
                        </label>

                    </div>

                </div>

            </fieldset>



            <!-- ==================================
                 GÉNERO
            =================================== -->

            <fieldset>

                <legend>Género</legend>

                <div class="opciones">

                    <label>

                        <input
                            type="radio"
                            name="genero"
                            value="femenino"
                            required
                        >

                        Femenino

                    </label>


                    <label>

                        <input
                            type="radio"
                            name="genero"
                            value="masculino"
                        >

                        Masculino

                    </label>


                    <label>

                        <input
                            type="radio"
                            name="genero"
                            value="otro"
                        >

                        Otro

                    </label>

                </div>

            </fieldset>



            <!-- ==================================
                 CONTRASEÑA
            =================================== -->

            <fieldset>

                <legend>Seguridad</legend>


                <!-- CONTRASEÑA -->

                <div class="campo">

                    <label for="password">
                        Contraseña:
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingrese una contraseña"
                        required
                    >

                </div>


                <!-- CONFIRMAR CONTRASEÑA -->

                <div class="campo">

                    <label for="confirmar">
                        Confirmar contraseña:
                    </label>

                    <input
                        type="password"
                        id="confirmar"
                        name="confirmar"
                        placeholder="Repita su contraseña"
                        required
                    >

                </div>

            </fieldset>



            <!-- ==================================
                 COMENTARIOS
            =================================== -->

            <fieldset>

                <legend>Comentarios</legend>

                <div class="campo">

                    <label for="comentarios">
                        Comentarios adicionales:
                    </label>

                    <textarea
                        id="comentarios"
                        name="comentarios"
                        rows="5"
                        placeholder="Escriba aquí sus comentarios..."
                    ></textarea>

                </div>

            </fieldset>



            <!-- ==================================
                 CHECKBOX
            =================================== -->

            <div class="aceptar">

                <label>

                    <input
                        type="checkbox"
                        id="terminos"
                        name="terminos"
                        required
                    >

                    Acepto los términos y condiciones
                    del registro.

                </label>

            </div>



            <!-- ==================================
                 BOTONES
            =================================== -->

            <div class="botones">

                <button
                    type="submit"
                    class="btn-registrar"
                >
                    Registrar estudiante
                </button>


                <button
                    type="reset"
                    class="btn-limpiar"
                >
                    Limpiar formulario
                </button>

            </div>


        </form>

    </main>



    <!-- ==================================
         PIE DE PÁGINA
    =================================== -->

    <footer>

        <p>
            © 2026 Registro de Estudiantes
        </p>

    </footer>


</body>

</html>
